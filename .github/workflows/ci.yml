name: CI

# Runs the model-independent test suites on every push / PR so "green" is gated
# on merge, not produced only on a developer's machine (audit finding RC-7).
on:
  push:
    branches: [main, "**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install shared package + Tool 1/2 deps (incl. test extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e shared
          # [dev] extras pull in pytest + httpx. httpx is REQUIRED by Starlette's
          # TestClient (test_api.py / test_e2e_flow.py / Tool 2 integration tests);
          # CI previously installed only bare pytest, so collection errored out.
          pip install -e "tool-1-cv-maker[dev]"
          pip install -e "tool-2-trainer-dashboard[dev]"

      - name: Compile-check all backend sources
        run: |
          python -m compileall -q tool-1-cv-maker/src tool-2-trainer-dashboard/src shared launcher.py

      - name: Tool 1 FULL suite (model-independent; LLM correctness tests self-skip)
        working-directory: tool-1-cv-maker
        env:
          AMS_ENFORCE_OFFLINE: "1"
        run: |
          # test_llm_correctness.py self-skips when the GGUF model is absent (CI has none).
          python -m pytest tests/ -q

      - name: Tool 2 tests
        run: |
          if [ -d tool-2-trainer-dashboard/tests ]; then \
            python -m pytest tool-2-trainer-dashboard/tests -q ; \
          else echo "no tool-2 tests dir"; fi

      - name: API docs generated from code (no manual drift)
        run: |
          python scripts/dump_openapi.py
          test -f docs/openapi-tool1.json && test -f docs/openapi-tool2.json

  security-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Dependency vulnerability scan (non-blocking)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r tool-1-cv-maker/requirements.txt || true
          pip-audit -r tool-2-trainer-dashboard/requirements.txt || true

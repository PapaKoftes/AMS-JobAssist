name: CI

# Runs the model-independent test suites on every push / PR so "green" is gated
# on merge, not produced only on a developer's machine (audit finding RC-7).
on:
  push:
    branches: [main, "**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install shared package + Tool 1 deps
        run: |
          python -m pip install --upgrade pip
          pip install -e shared
          pip install -e tool-1-cv-maker
          pip install -e tool-2-trainer-dashboard
          pip install pytest

      - name: Compile-check all backend sources
        run: |
          python -m compileall -q tool-1-cv-maker/src tool-2-trainer-dashboard/src shared launcher.py

      - name: Tool 1 unit + remediation tests (model-independent)
        working-directory: tool-1-cv-maker
        env:
          AMS_ENFORCE_OFFLINE: "1"
        run: |
          python -m pytest tests/test_remediation.py tests/test_privacy.py tests/test_offline_integrity.py -q

      - name: Tool 2 tests (if present)
        run: |
          if [ -d tool-2-trainer-dashboard/tests ]; then \
            python -m pytest tool-2-trainer-dashboard/tests -q ; \
          else echo "no tool-2 tests dir"; fi

  security-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Dependency vulnerability scan (non-blocking)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r tool-1-cv-maker/requirements.txt || true
          pip-audit -r tool-2-trainer-dashboard/requirements.txt || true
